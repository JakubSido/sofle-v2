# Uncomment the following line to enable the Sofle OLED Display
CONFIG_ZMK_DISPLAY=y

# nice!view "messy rows" fix: the Sharp MIP panel needs its VCOM polarity
# toggled regularly or the image decays into garbage. The ls0xx driver only
# toggles VCOM when ZMK sends a frame, and the nice!view shield wires no
# extcomin-gpios (no hardware VCOM). On a peripheral half the display content
# rarely changes, so VCOM stalls and the panel rots; a later partial repaint
# only refreshes the dirty rows, leaving garbage on the rest. The keepalive
# module (src/vcom_keepalive.c) forces a full-screen redraw every interval to
# keep VCOM toggling. NOTE: depends on ZMK_DISPLAY, so it stays off on the
# dongle (which disables the display).
CONFIG_NICE_VIEW_VCOM_KEEPALIVE=y
CONFIG_NICE_VIEW_VCOM_KEEPALIVE_INTERVAL_MS=1000

# Headroom for the full-screen redraws the keepalive forces (default pool is
# 4096; nRF52840 has 256KB RAM). Harmless to keep.
CONFIG_LV_Z_MEM_POOL_SIZE=8192

# Uncomment these two lines to add support for encoders
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# enable deep sleep to save power
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000

# NOTE: nice!view is a persistent Sharp Memory LCD with no backlight, so it
# does NOT visibly go dark on blank/idle - the last frame stays on the glass.
# BLANK_ON_IDLE is effectively a no-op visually here; left enabled as harmless.
CONFIG_ZMK_DISPLAY_BLANK_ON_IDLE=n
# 15s idle just enters the low-power idle activity state a bit sooner (minor
# battery trim). It does NOT clear display noise - only a full panel re-init
# does that, which happens on wake from deep sleep (see IDLE_SLEEP_TIMEOUT).
CONFIG_ZMK_IDLE_TIMEOUT=15000

# NOTE: CONFIG_LV_Z_FULL_REFRESH (force whole-panel repaint to scrub display
# noise) was tried here but blanks the nice!view on this ZMK v0.3 - its 1-bit
# Sharp panel uses a custom flush that doesn't support full_refresh, even with
# CONFIG_LV_Z_VDB_SIZE=100. Reverted. Noise is instead mitigated by the more
# frequent deep-sleep wakes (full panel re-init) from the shorter
# IDLE_SLEEP_TIMEOUT above. For continuous scrubbing during long sessions, a
# custom widget module (e.g. zmk-nice-oled) is the working path.

# BLE TX power left at default (0 dBm) to maximize battery life.
# Re-enable the line below (+8 dBm) if BLE dropouts/lag return.
# CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# 2. Force the connection to be more responsive (reduces retry lag)
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=5
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=5

# 3. Optional: Improve Bluetooth stability
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y
# Uncomment this line below to add rgb underglow / backlight support
# CONFIG_ZMK_RGB_UNDERGLOW=y

# Uncomment the line below to disable external power toggling by the underglow.
# By default toggling the underglow on and off also toggles external power
# on and off. This also causes the display to turn off.
# CONFIG_ZMK_RGB_UNDERGLOW_EXT_POWER=n
