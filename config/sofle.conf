# Uncomment the following line to enable the Sofle OLED Display
CONFIG_ZMK_DISPLAY=y

# Uncomment these two lines to add support for encoders
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# enable deep sleep to save power
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000

# NOTE: nice!view is a persistent Sharp Memory LCD with no backlight, so it
# does NOT visibly go dark on blank/idle - the last frame stays on the glass.
# BLANK_ON_IDLE is effectively a no-op visually here; left enabled as harmless.
CONFIG_ZMK_DISPLAY_BLANK_ON_IDLE=y
# 15s idle just enters the low-power idle activity state a bit sooner (minor
# battery trim). It does NOT clear display noise - only a full panel re-init
# does that, which happens on wake from deep sleep (see IDLE_SLEEP_TIMEOUT).
CONFIG_ZMK_IDLE_TIMEOUT=15000

# Force LVGL to repaint the ENTIRE panel on every refresh instead of only the
# changed regions. This continuously overwrites any stray bits, so the snow/
# noise that accumulates on the Sharp Memory LCD can't build up. The nice!view
# animated artwork keeps refreshing even while idle, so the panel is scrubbed
# constantly. Small extra redraw cost (tiny 1-bit panel).
# full_refresh requires a FULL-screen draw buffer; ZMK's default VDB is only a
# fraction of the screen, which left the panel blank. Size the buffer to 100%
# of the screen so LVGL can repaint the whole panel.
CONFIG_LV_Z_FULL_REFRESH=y
CONFIG_LV_Z_VDB_SIZE=100

# Slow the repaint rate to ~1s. With full_refresh on, the default ~33ms rate
# would rewrite the whole panel ~30x/sec (battery hog). A full repaint once per
# second is plenty to keep noise scrubbed at a fraction of the power. Tradeoff:
# choppy animation and ~1s lag on status updates (layer/battery indicators).
# Tick raised to match so the display task only wakes ~1x/sec, not 100x/sec.
CONFIG_LV_DEF_REFR_PERIOD=1000
CONFIG_ZMK_DISPLAY_TICK_PERIOD_MS=1000

# BLE TX power left at default (0 dBm) to maximize battery life.
# Re-enable the line below (+8 dBm) if BLE dropouts/lag return.
# CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# 2. Force the connection to be more responsive (reduces retry lag)
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=5
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=5

# 3. Optional: Improve Bluetooth stability
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y
# Uncomment this line below to add rgb underglow / backlight support
# CONFIG_ZMK_RGB_UNDERGLOW=y

# Uncomment the line below to disable external power toggling by the underglow.
# By default toggling the underglow on and off also toggles external power
# on and off. This also causes the display to turn off.
# CONFIG_ZMK_RGB_UNDERGLOW_EXT_POWER=n
